syntax = "proto3";

package ir;

// Timestamp for event ordering
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// Metadata about the source file
message SourceMetadata {
  string file_path = 1;
  string language = 2;  // e.g., "python", "java", "go"
  Timestamp timestamp = 3;
}

// Event: Function declaration observed
message FunctionDeclared {
  string name = 1;
  int32 param_count = 2;
  int32 line_number = 3;
  string parent_scope = 4;  // Empty string for top-level, class name for methods
  string return_type = 5;   // Return type annotation (field 5 matches Module 1 wire format)
  repeated string decorators = 6;  // Annotations/decorators e.g. ["@Bean", "@Override"]
}

// Event: Function call observed
message FunctionCall {
  string caller_function = 1;  // Function where the call happens
  string callee_name = 2;      // Function being called
  int32 arg_count = 3;
  int32 line_number = 4;
}

// Event: Return statement observed
message ReturnStatement {
  string function_name = 1;
  bool has_value = 2;  // True if returning a value, false for bare return
  int32 line_number = 3;
}

// Event: Import/Include statement observed
message ImportStatement {
  string module_name = 1;
  repeated string imported_names = 2;  // Specific names imported, empty for "import module"
  bool is_wildcard = 3;  // True for "from module import *"
  int32 line_number = 4;
}

// Event: Control structure observed
message ControlStructure {
  enum Type {
    IF = 0;
    WHILE = 1;
    FOR = 2;
    SWITCH = 3;
    TRY = 4;
  }
  Type type = 1;
  string parent_function = 2;  // Function containing this structure
  int32 line_number = 3;
  bool has_else = 4;  // For if/try statements
}

// Event: Class declaration observed
message ClassDeclared {
  string name = 1;
  repeated string base_classes = 2;
  int32 line_number = 3;
  repeated string decorators = 4;  // Annotations on the class e.g. ["@Data", "@Entity"]
}

// Event: Variable assignment observed
message VariableAssignment {
  string variable_name = 1;
  string scope = 2;  // Function or class name, or "global"
  int32 line_number = 3;
}

// ===== EXTENDED EVENTS (8 Crucial Additions) =====

// Event: Exception/Error thrown
message ThrowStatement {
  string exception_type = 1;  // Type of exception (e.g., "ValueError", "Exception")
  string parent_function = 2;  // Function where throw occurs
  int32 line_number = 3;
  bool has_message = 4;  // Whether an error message is provided
}

// Event: Exception catch/except clause
message CatchClause {
  repeated string exception_types = 1;  // Types caught (e.g., ["ValueError", "KeyError"])
  string parent_function = 2;  // Function containing the catch
  int32 line_number = 3;
  bool is_catch_all = 4;  // True for bare except/catch (catches all)
}

// Event: Interface/Protocol/Trait declaration
message InterfaceDeclared {
  string name = 1;
  repeated string base_interfaces = 2;  // Parent interfaces
  int32 line_number = 3;
  int32 method_count = 4;  // Number of methods defined
}

// Event: Enumeration declaration
message EnumDeclared {
  string name = 1;
  int32 member_count = 2;  // Number of enum members
  int32 line_number = 3;
}

// Event: Member/property access (obj.field, obj.method)
message MemberAccess {
  string object_name = 1;  // Object being accessed
  string member_name = 2;  // Member/property name
  string parent_function = 3;  // Function where access occurs
  int32 line_number = 4;
  bool is_method_call = 5;  // True if followed by (), false for property access
}

// Event: Lambda/anonymous function declaration
message LambdaDeclared {
  int32 param_count = 1;
  string parent_function = 2;  // Function containing the lambda
  int32 line_number = 3;
}

// Event: Async function declaration
message AsyncFunctionDeclared {
  string name = 1;
  int32 param_count = 2;
  int32 line_number = 3;
  string parent_scope = 4;  // Empty string for top-level, class name for methods
  string return_type = 5;   // Return type annotation (field 5 matches Module 1 wire format)
  repeated string decorators = 6;  // Annotations/decorators e.g. ["@Bean", "@Override"]
}

// Event: Await expression (async call)
message AwaitExpression {
  string awaited_function = 1;  // Function being awaited
  string parent_function = 2;  // Function where await occurs
  int32 line_number = 3;
}


// Unified IR Event wrapper
message IREvent {
  SourceMetadata metadata = 1;
  
  // Only one of these will be set per event
  oneof event {
    FunctionDeclared function_declared = 10;
    FunctionCall function_call = 11;
    ReturnStatement return_statement = 12;
    ImportStatement import_statement = 13;
    ControlStructure control_structure = 14;
    ClassDeclared class_declared = 15;
    VariableAssignment variable_assignment = 16;
    
    // Extended events
    ThrowStatement throw_statement = 20;
    CatchClause catch_clause = 21;
    InterfaceDeclared interface_declared = 22;
    EnumDeclared enum_declared = 23;
    MemberAccess member_access = 24;
    LambdaDeclared lambda_declared = 25;
    AsyncFunctionDeclared async_function_declared = 26;
    AwaitExpression await_expression = 27;
  }
}

// Request to start monitoring a file
message MonitorFileRequest {
  string file_path = 1;
  string language = 2;
}

// Response confirming monitoring started
message MonitorFileResponse {
  bool success = 1;
  string message = 2;
}

// Service definition for streaming IR events
service IREventStream {
  // Start monitoring a file and stream events as they occur
  rpc StreamEvents(MonitorFileRequest) returns (stream IREvent);
  
  // Send a batch of events (for testing or batch processing)
  rpc SendEventBatch(stream IREvent) returns (MonitorFileResponse);
}