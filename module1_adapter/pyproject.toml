[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "module1_adapter"
version = "0.1.0"
description = "Language Adapter for IR Event Extraction (Python, Java, Go, Rust, C, Ruby)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.0",
    "pygls>=1.3.0",
    "lsprotocol>=2.0.0",
]

[project.scripts]
module1-adapter = "module1_adapter.core.adapter:main"
